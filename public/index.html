<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Jump</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="game-board">
        <span class="score-box"></span>
        <img src="../imgs/clouds.png" class="clouds">
        <img src="../imgs/mario.gif" class="mario">
        <img src="../imgs/pipe.png" class="pipe">
        <div class="gameover-box">
            <h1>Game Over</h1>
            <button class="playagain-button" onclick="window.location.reload()">Play again</button>
            <button class="save-score-button" onclick="loginUsuario()">Save Score</button>
        </div>
        <div class="loginContainer">
            <input type="text" id="usernamme" placeholder="USUÁRIO">
            <input type="password" id="password" placeholder="SENHA">
            <button onclick="handleSignUp()">CADASTRAR</button>
            <button onclick="handleLogin()">ENTRAR</button>
            <button onclick="fecharContainer()">X</button>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
