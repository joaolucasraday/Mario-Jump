<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Jump</title>
    <link rel="shortcut icon" href="../imgs/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="game-board">
        <span class="best-score"></span>
        <span class="score-box"></span>
        <img src="../imgs/clouds.png" class="clouds">
        <img src="../imgs/mario.gif" class="mario">
        <img src="../imgs/pipe.png" class="pipe">
        <div class="gameover-box">
            <h1>Game Over</h1>
            <button class="playagain-button" onclick="window.location.reload()">Play again</button>
            <button class="main-menu" onclick="window.location.href = 'home.html'">Main menu</button>
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
